name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# softprops/action-gh-release (sotto) deve poter creare/aggiornare tag e
# release — permesso non concesso di default alle PR da fork, ma i passi
# che lo usano sono comunque disabilitati lì (if: github.ref == refs/heads/main).
permissions:
  contents: write

jobs:
  build-linux:
    # Piattaforma "di riferimento" del progetto (PipeWireEngine/BlueZManager,
    # vedi src/audio/AudioEngine.h) — deve sempre passare.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev libsndfile1-dev

      # Qt6 via jurplel/install-qt-action, non il pacchetto apt: quello di
      # Ubuntu è più vecchio di 6.5 e non ha
      # QQmlApplicationEngine::loadFromModule usato in src/main.cpp — un
      # primo tentativo di aggirarlo cambiando quella riga ha rotto l'app
      # in locale su un Qt vero (percorso qrc sbagliato), quindi la
      # versione di Qt va sistemata qui, non nel codice.
      - name: Installa Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: "qtshadertools"

      - name: Configura
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compila
        run: cmake --build build

      # --- Distribuzione (solo push su main, vedi i singoli step) ---
      # AppImage: stesso schema linuxdeploy usato da altri progetti di
      # questo autore (OQL) — un solo file autocontenuto, gira su
      # qualunque distro senza installazione.
      - name: Pacchettizza AppImage
        if: github.ref == 'refs/heads/main'
        run: |
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          install -Dm755 build/bluecue AppDir/usr/bin/bluecue
          install -Dm644 res/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/bluecue.svg
          install -Dm644 res/bluecue.desktop AppDir/usr/share/applications/bluecue.desktop

          # QML_SOURCES_PATHS: stesso motivo del --qmldir su windeployqt/
          # macdeployqt (vedi i job build-windows/build-macos) — senza,
          # linuxdeploy-plugin-qt non scopre i moduli QML importati
          # (QtQuick.Dialogs, QtQuick.Layouts) e non li include nell'AppImage.
          # Non ancora osservato dal vivo qui perché il test "live" di questo
          # progetto è sempre stato ./build/bluecue contro il Qt di sistema,
          # mai l'AppImage scaricata a freddo.
          QMAKE=$(which qmake6 || which qmake) \
          QML_SOURCES_PATHS="$PWD/qml" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage

          find . -maxdepth 1 -name '*.AppImage' \
            ! -name 'linuxdeploy' ! -name 'linuxdeploy-plugin-qt' \
            -exec mv {} bluecue-linux.AppImage \;

      - name: Carica artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bluecue-linux
          path: bluecue-linux.AppImage
          retention-days: 30

      # tag_name fisso "dev-latest" (prerelease, mai "latest" vero) invece
      # di un tag per commit: un solo link stabile da mettere nella pagina
      # di download, sovrascritto ad ogni push su main — stesso schema di
      # OQL (https://github.com/teonactl/oql).
      - name: Pubblica su dev-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Build automatica (ultimo main)"
          prerelease: true
          make_latest: false
          body: "Ultima build automatica dal branch `main`. Aggiornata ad ogni push. Nessuna garanzia di stabilità."
          files: bluecue-linux.AppImage

  build-macos:
    # macos-14+ sono runner Apple Silicon (arm64) nativi, non emulazione
    # Intel — stessa architettura target di CoreAudioEngine/
    # AppleBluetoothManager (vedi src/audio/CoreAudioEngine.h). Primo test
    # reale di quel backend: scritto seguendo la documentazione Apple ma
    # mai compilato in locale (l'ambiente di sviluppo di questo progetto è
    # Linux) — qui ci si aspettano dei fix in un paio di iterazioni.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installa Qt (Homebrew)
        run: brew install qt ninja

      # icon.icns va generato PRIMA del configure: CMakeLists.txt lo
      # include nel bundle solo se il file esiste già a quel punto (vedi
      # il commento lì) — se questo step si spostasse dopo "Configura" il
      # bundle finirebbe senza icona custom, senza errore visibile.
      - name: Genera icona
        if: github.ref == 'refs/heads/main'
        run: |
          brew install librsvg
          mkdir -p res/icon.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size res/icon.svg \
              -o res/icon.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size*2)) -h $((size*2)) res/icon.svg \
              -o res/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns res/icon.iconset -o res/icon.icns

      - name: Configura
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Compila
        run: cmake --build build

      # --- Distribuzione (solo push su main) ---
      - name: Deploy Qt nel bundle
        if: github.ref == 'refs/heads/main'
        run: |
          # -qmldir=qml: stesso motivo del --qmldir su windeployqt (vedi
          # commento nel job build-windows) — senza, macdeployqt non
          # scopre i moduli QML importati (QtQuick.Dialogs, QtQuick.Layouts)
          # e non li include nel bundle, causando lo stesso probabile
          # mancato avvio mai verificato dal vivo su questa piattaforma.
          "$(brew --prefix qt)/bin/macdeployqt" build/bluecue-app.app -qmldir=qml

      # Firma ad-hoc (nessun account Apple Developer): senza, Gatekeeper
      # blocca l'app al primo avvio dopo il download. Ordine bottom-up
      # (dylib sciolte, poi PlugIns, poi ogni .framework dal binario Mach-O
      # interno al bundle, infine l'app stessa) — un framework firmato
      # prima del suo binario interno invalida la propria firma.
      - name: Firma (ad-hoc)
        if: github.ref == 'refs/heads/main'
        run: |
          find build/bluecue-app.app/Contents/Frameworks -maxdepth 1 -name "*.dylib" \
            -exec codesign --sign - --force {} \;
          find build/bluecue-app.app/Contents/PlugIns -name "*.dylib" \
            -exec codesign --sign - --force {} \;
          find build/bluecue-app.app/Contents/Frameworks -maxdepth 1 -name "*.framework" | while read fw; do
            bin=$(basename "$fw" .framework)
            find "$fw" -type f -name "$bin" -exec codesign --sign - --force {} \;
            codesign --sign - --force "$fw"
          done
          codesign --sign - --force build/bluecue-app.app

      # Staging dir invece di puntare hdiutil direttamente a bluecue-app.app:
      # hdiutil -srcfolder copia il CONTENUTO della cartella sorgente nella
      # root del DMG, quindi serve una cartella che CONTIENE il bundle
      # (rinominato qui in BlueCue.app, il nome che l'utente vede) perché
      # il DMG finisca con BlueCue.app trascinabile in root, non solo Contents/.
      - name: Crea DMG
        if: github.ref == 'refs/heads/main'
        run: |
          STAGING=$(mktemp -d)
          ditto build/bluecue-app.app "$STAGING/BlueCue.app"
          hdiutil create -volname "BlueCue" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            build/BlueCue-macOS.dmg
          rm -rf "$STAGING"

      - name: Carica artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BlueCue-macOS
          path: build/BlueCue-macOS.dmg
          retention-days: 30

      - name: Pubblica su dev-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Build automatica (ultimo main)"
          prerelease: true
          make_latest: false
          body: "Ultima build automatica dal branch `main`. Aggiornata ad ogni push. Nessuna garanzia di stabilità."
          files: build/BlueCue-macOS.dmg

  build-windows:
    # Primo test reale del backend Windows (WasapiEngine/
    # WindowsBluetoothManager, vedi src/audio/WasapiEngine.h): scritto
    # seguendo la documentazione WASAPI/Media Foundation/Bluetooth classico
    # ma mai compilato in locale (l'ambiente di sviluppo di questo
    # progetto è Linux) — qui ci si aspettano dei fix in un paio di
    # iterazioni, come già successo per macOS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # jurplel/install-qt-action invece di aqtinstall "a mano" (usato su
      # Linux): stessa libreria sotto, ma con i nomi modulo già mappati
      # correttamente per versione — l'installazione diretta con aqtinstall
      # ci ha già dato nomi modulo sbagliati una volta (vedi la storia di
      # questo file), meglio non ripetere il tentativo alla cieca due volte.
      - name: Installa Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: "qtshadertools"

      # Il generatore "Visual Studio 17 2022" di CMake non trovava
      # l'installazione VS sul runner (vswhere non la individuava, causa
      # non chiara) — Ninja + l'ambiente MSVC impostato esplicitamente da
      # questa action bypassano del tutto quella ricerca automatica.
      - name: Configura ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # icon.ico serve solo in fase di compilazione (compilazione della
      # risorsa .rc, non del configure) — generato comunque qui, prima di
      # tutto, per semplicità e coerenza con lo step analogo su macOS.
      - name: Genera icona
        if: github.ref == 'refs/heads/main'
        run: magick res/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 res/icon.ico

      - name: Configura
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compila
        run: cmake --build build

      # --- Distribuzione (solo push su main) ---
      # windeployqt raccoglie tutte le DLL Qt necessarie accanto all'exe.
      # Da qui si producono DUE pacchetti: uno zip portatile (estrai e
      # avvia, nessuna installazione) e un vero installer Inno Setup
      # (installer.iss, alla radice del repo) che in più installa il
      # runtime Visual C++ redistributable e crea le voci nel menu Start /
      # sul desktop — stesso schema di OQL (github.com/teonactl/oql).
      - name: Pacchettizza
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\BlueCue -Force | Out-Null
          Copy-Item build\bluecue.exe dist\BlueCue\
          # --qmldir è OBBLIGATORIO: senza, windeployqt non ha modo di sapere
          # quali moduli QML servono (li scopre leggendo gli "import" nei
          # sorgenti .qml, non dal binario) e non copia i plugin di
          # QtQuick/QtQuick.Dialogs/QtQuick.Layouts ecc. — causa dell'app che
          # non parte affatto ("modulo non installato" nel log per QtQuick,
          # QtQuick.Dialogs e a cascata anche Main.qml stesso).
          windeployqt --release --compiler-runtime --qmldir qml dist\BlueCue\bluecue.exe
          Compress-Archive -Path dist\BlueCue\* -DestinationPath BlueCue-windows.zip

      - name: Crea installer (Inno Setup)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          $version = git describe --tags --always 2>$null
          if (-not $version) { $version = "0.1.0" }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            /DMyAppVersion="$version" `
            /DOutputFile="BlueCue-windows-setup" `
            installer.iss

      - name: Carica artifact (zip)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BlueCue-windows
          path: BlueCue-windows.zip
          retention-days: 30

      - name: Carica artifact (installer)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BlueCue-windows-setup
          path: BlueCue-windows-setup.exe
          retention-days: 30

      - name: Pubblica su dev-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Build automatica (ultimo main)"
          prerelease: true
          make_latest: false
          body: "Ultima build automatica dal branch `main`. Aggiornata ad ogni push. Nessuna garanzia di stabilità."
          files: |
            BlueCue-windows.zip
            BlueCue-windows-setup.exe
